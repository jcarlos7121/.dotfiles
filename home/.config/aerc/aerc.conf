# aerc settings (defaults: /usr/share/aerc/aerc.conf, man aerc-config).
# Accounts live in accounts.conf, which is NOT in the dotfiles (credentials).

[general]
default-save-path=~/Downloads

[ui]
# "default" uses the terminal's colors, so aerc follows the Omarchy theme
styleset-name=default
threading-enabled=true
fuzzy-complete=true
mouse-enabled=true
sidebar-width=22

[viewer]
# Prefer the plain-text part; fall back to HTML (rendered through w3m)
alternatives=text/plain,text/html

[compose]
editor=nvim

[filters]
text/plain=colorize
text/calendar=calendar
message/delivery-status=colorize
message/rfc822=colorize
text/html=! html
.headers=colorize

[openers]
x-scheme-handler/http=xdg-open
x-scheme-handler/https=xdg-open
