# Keep the hardware at 48 kHz and let PipeWire resample 44.1 kHz streams.
# The Asahi default (99-asahi.conf) follows each stream's rate, and every
# 44.1 <-> 48 kHz switch reconfigures the MacBook speakers with an audible pop
# when one video stops and another starts.
context.properties = {
  default.clock.allowed-rates = [ 48000 ]
}
