onboarding = false

[theme]
name = "vesper"
auto_switch = false

[keys]
# tmux: set -g prefix C-a
prefix = "ctrl+a"

# tmux: bind | split-window -h  (side-by-side panes)
# Spanish/ISO Mac layout: the | key is really alt+1, so bind the physical chord.
split_vertical = ["prefix+alt+1", "prefix+|"]
# tmux: bind - split-window -v  (stacked panes)
split_horizontal = "prefix+minus"

# tmux: bind -n S-Left/S-Right previous/next-window (direct, no prefix)
previous_tab = "shift+left"
next_tab = "shift+right"

# tmux: bind c new-window + rename prompt (prompt comes from ui.prompt_new_tab_name)
new_tab = "prefix+c"
# tmux: bind , rename-window
rename_tab = "prefix+comma"

# new session ≈ new workspace (prefix+C)
new_workspace = "prefix+shift+c"
# tmux default: prefix+$ rename-session
rename_workspace = "prefix+shift+$"

# tmux: bind ' choose-window
goto = "prefix+quote"

# tmux: prefix+s session list (sessions ≈ herdr workspaces/spaces)
workspace_picker = "prefix+s"
# settings UI moved off prefix+s to make room for the picker
settings = "prefix+g"

# tmux default: prefix+d detach
detach = "prefix+d"

# cycle through agent panes (herdr ships these unbound)
next_agent = "prefix+n"
previous_agent = "prefix+p"

# moved off their defaults (prefix+e / prefix+o) to make room for the
# herdr-nvim sidebar and file picker bound below
edit_scrollback = "prefix+shift+e"

# direct one-keystroke pane resizing (herdr 0.8.2+), mirroring ctrl+h/j/k/l nav
resize_pane_left = "ctrl+alt+h"
resize_pane_down = "ctrl+alt+j"
resize_pane_up = "ctrl+alt+k"
resize_pane_right = "ctrl+alt+l"

# navigate mode (prefix+s space picker): vim keys to move up/down the list
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
# j/k now drive the space list, so unbind them from pane movement in this mode
# (arrows still focus panes left/right; prefix+h/j/k/l still moves panes normally)
navigate_pane_down = ""
navigate_pane_up = ""

# tmux default: prefix+[ enters copy mode
# alt+backtick = the [ key on Spanish/ISO Mac layout (⌥`); prefix+[ covers the ZMK/US-Intl board
copy_mode = ["prefix+[", "prefix+alt+backtick"]

# vim-tmux-navigator equivalent: herdr-splits.nvim forwards ctrl+h/j/k/l into
# Neovim panes and moves herdr pane focus everywhere else (paired with the
# lazy.nvim spec in nvim's plugins.lua). Resize actions deliberately unbound:
# alt+h/j/k/l would require kitty macos_option_as_alt, which breaks Spanish-
# layout Option typing (| [ { ...) — use prefix+r resize mode instead.
# Herdr's own focus_pane_* remain on their defaults (prefix+h/j/k/l).
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "navigate right (vim/herdr)"

# close the focused pane when it's an agent pane — claude, codex, grok,
# opencode, anything else herdr detects (counterpart of nvim ,4; guarded
# script, does nothing on shell/editor panes). prefix+4 would shadow
# switch_tab's prefix+1..9, hence q.
[[keys.command]]
key = "prefix+q"
type = "shell"
command = "/Users/juanhinojo/.local/bin/herdr-agent-close"
description = "close focused agent pane"

# Herdr Nvim

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[ui]
# match tmux rename prompts on window/session creation
prompt_new_tab_name = true
prompt_new_workspace_name = true
# tab row at the bottom, like tmux status-position bottom
tab_bar_position = "bottom"

# in-app toasts — plugins report their errors this way (default "off" hides them)
show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[experimental]
# Kitty graphics passthrough for images (icat, timg, etc.) — outer terminal is kitty
kitty_graphics = true
