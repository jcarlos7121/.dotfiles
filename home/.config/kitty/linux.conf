# Linux (Omarchy) kitty settings (included from kitty.conf)

# Omarchy's theme colors; follows `omarchy theme set`
include ~/.local/state/omarchy/current/theme/kitty.conf

# macOS points render ~25% smaller than Linux's 96 DPI ones, so 11 here
# looks about like 14 on the Mac
font_size 11.0
shell /usr/bin/fish
editor nvim

# Software rendering (no GPU acceleration on this Mac yet): every repaint costs
# CPU in kitty and again in Hyprland, so skip the purely decorative ones.
# (kitty has no end-of-line comments, so each note sits above its setting.)

# A blinking cursor repaints twice a second while idle
cursor_blink_interval 0

# The trail animates every frame while the cursor moves
cursor_trail 0

# Cap redraws at ~60/s (default 10ms = 100/s)
repaint_delay 16
