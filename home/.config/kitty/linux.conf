# Linux (Omarchy) kitty settings (included from kitty.conf)

# Omarchy's theme colors; follows `omarchy theme set`
include ~/.local/state/omarchy/current/theme/kitty.conf

# macOS points render ~25% smaller than Linux's 96 DPI ones, so 11 here
# looks about like 14 on the Mac
font_size 11.0
shell /usr/bin/fish
editor nvim
